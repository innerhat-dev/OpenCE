name: Apple regression checks

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'port/**'
      - 'tools/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'port/**'
      - 'tools/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    # ARM64 guest probes execute on Apple Silicon. These tests use authored
    # fixtures and public dependencies; no maps, Xbox SDK or signing account.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HALO_MACOS_LLVM_BIN: /opt/homebrew/opt/llvm@22/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public toolchain
        run: |
          brew install llvm@22 lld@22 sdl3 ninja
          printf '%s\n' /opt/homebrew/opt/lld@22/bin >> "$GITHUB_PATH"
      - name: Verify runner and prepare dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 tools/macos_setup.py
          python3 tools/macos_build.py --plugin-only
          python3 tools/ios_build.py --plugin-only
      - name: Mac ABI, allocation, networking and audio
        run: python3 tools/test_macos_runtime.py --standalone
      - name: Signed iOS instruction image
        run: python3 tools/test_ios_runtime.py
      - name: Controls, rendering and workload verification
        run: python3 -m unittest tools.test_input_bindings tools.test_visibility_queries tools.test_geometry_cache tools.test_presentation tools.test_macos_preflight tools.test_macos_benchmark
      - name: Version 11 network protocol
        run: python3 -m unittest tools.test_network_pings tools.test_network_v11
      - name: Native data import and packaging rules
        run: python3 tools/test_macos_menu.py
      - name: App installation and desktop data migration
        run: python3 -m unittest tools.test_macos_installer tools.test_save_migration
      - name: Native community map download fixtures
        run: python3 tools/test_macos_map_downloads.py
      - name: Managed map lookup and precache readiness
        run: python3 -m unittest tools.test_custom_maps tools.test_map_download_precache tools.test_map_catalog tools.test_publish_map_catalog
      - name: Native Settings keeps the game loop running
        run: python3 tools/test_macos_menu.py --check-ui
